<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner 1 – Neon Edge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

  .banner {
    width: 820px;
    height: 312px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(125deg, #1a0038 0%, #3d0080 30%, #6600cc 60%, #8b00ff 80%, #4b0082 100%);
    font-family: 'Arial Black', 'Impact', sans-serif;
  }

  /* Animated glowing orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
  }
  .orb1 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #ff00cc, transparent);
    top: -80px; left: -60px;
  }
  .orb2 {
    width: 250px; height: 250px;
    background: radial-gradient(circle, #cc00ff, transparent);
    bottom: -60px; right: 80px;
  }
  .orb3 {
    width: 180px; height: 180px;
    background: radial-gradient(circle, #ff3399, transparent);
    top: 40px; right: 200px;
    opacity: 0.3;
  }

  /* Grid lines */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Left accent bar */
  .accent-left {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(180deg, #ff00cc, #ff6600, #ffcc00);
  }

  /* Diagonal slice */
  .slice {
    position: absolute;
    top: 0; bottom: 0;
    left: 60px;
    width: 3px;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent, rgba(255,255,255,0.15));
    transform: skewX(-8deg);
  }
  .slice2 {
    left: 75px;
    width: 1px;
    opacity: 0.4;
  }

  /* Content */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 60px 0 90px;
  }

  .tag {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 4px;
    color: rgba(255,204,0,0.7);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .headline {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.05;
    color: #ffffff;
    text-transform: uppercase;
    text-shadow: 0 0 30px rgba(255,0,204,0.5), 0 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 14px;
    position: relative;
  }
  .headline span {
    background: linear-gradient(90deg, #ffffff, #e8b4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subline {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3.5px;
    color: #ffaa00;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-shadow: 0 0 12px rgba(255,170,0,0.6);
  }

  .tagline {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    font-family: Arial, sans-serif;
  }

  /* Right geometric decoration */
  .geo-right {
    position: absolute;
    right: -20px;
    top: 50%;
    transform: translateY(-50%);
    width: 180px;
    height: 280px;
    opacity: 0.12;
  }

  /* Neon border bottom */
  .neon-line {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff00cc, #cc00ff, #ff00cc, transparent);
  }

  /* Corner decorations */
  .corner-tr {
    position: absolute;
    top: 16px; right: 20px;
    width: 50px; height: 50px;
    border-top: 2px solid rgba(255,255,255,0.2);
    border-right: 2px solid rgba(255,255,255,0.2);
  }
  .corner-bl {
    position: absolute;
    bottom: 16px; left: 90px;
    width: 35px; height: 35px;
    border-bottom: 2px solid rgba(255,204,0,0.3);
    border-left: 2px solid rgba(255,204,0,0.3);
  }

  /* Dot pattern */
  .dots {
    position: absolute;
    right: 30px; top: 30px;
    display: grid;
    grid-template-columns: repeat(6, 8px);
    gap: 6px;
    opacity: 0.15;
  }
  .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: white;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="grid"></div>
  <div class="accent-left"></div>
  <div class="slice"></div>
  <div class="slice slice2"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <svg class="geo-right" viewBox="0 0 180 280" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="90,10 170,60 170,160 90,210 10,160 10,60" stroke="white" stroke-width="1" fill="rgba(255,255,255,0.05)"/>
    <polygon points="90,40 150,75 150,145 90,180 30,145 30,75" stroke="white" stroke-width="0.5" fill="rgba(255,255,255,0.03)"/>
    <polygon points="90,70 130,95 130,130 90,155 50,130 50,95" stroke="white" stroke-width="0.5" fill="rgba(255,255,255,0.05)"/>
    <line x1="90" y1="10" x2="90" y2="210" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="10" y1="60" x2="170" y2="160" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <line x1="170" y1="60" x2="10" y2="160" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  </svg>

  <div class="content">
    <div class="tag">// Premium Funnel Strategy</div>
    <div class="headline"><span>I Turn Offers Into<br>Funnels That Sell</span></div>
    <div class="subline">Funnel Research &nbsp;·&nbsp; Conversion Copy &nbsp;·&nbsp; Fully Coded HTML Page</div>
    <div class="tagline">VSLs, Advertorials, Sales Pages — Built Not Just Written</div>
  </div>

  <div class="neon-line"></div>
</div>
</body>
</html>
