<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Banners – 3 Premium Versions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    gap: 60px;
    font-family: Arial, sans-serif;
  }
  h1 {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    text-align: center;
  }
  .banner-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .label {
    color: rgba(255,255,255,0.3);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  iframe {
    width: 820px;
    height: 312px;
    border: none;
    display: block;
    box-shadow: 0 20px 80px rgba(120,0,255,0.3), 0 4px 20px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
  <h1>Facebook Banner — 3 Premium Modern Versions</h1>

  <div class="banner-wrapper">
    <div class="label">Version 1 — Neon Edge / Dark Hex</div>
    <iframe src="banner1.html" scrolling="no"></iframe>
  </div>

  <div class="banner-wrapper">
    <div class="label">Version 2 — Glass Split / Orbital</div>
    <iframe src="banner2.html" scrolling="no"></iframe>
  </div>

  <div class="banner-wrapper">
    <div class="label">Version 3 — Bold Typographic / Full Gradient</div>
    <iframe src="banner3.html" scrolling="no"></iframe>
  </div>
</body>
</html>
